name: Descargar fotos candidatas

# Se ejecuta cuando cambia el script de búsqueda de fotos. Descarga las
# candidatas desde Wikimedia Commons y las guarda en photo_candidates/
# en la misma rama, para elegir las mejores.
on:
  push:
    paths:
      - tool/fetch_photos.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tool/fetch_photos.py
      - name: Guardar candidatas en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo_candidates
          git commit -m "Fotos candidatas descargadas de Wikimedia Commons" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
